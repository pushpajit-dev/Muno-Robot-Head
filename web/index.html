<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="./favicon.ico" />
  <title>Muno Robo</title>
  <meta name="description" content="Muno Robo - Animated 3D robot heads with reactive LED faces, Sketchware component studio and visual block creator." />
  <link rel="preload" href="./fonts/OpenRunde-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/OpenRunde-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    try {
      var saved = localStorage.getItem('munorobo-theme') || localStorage.getItem('robot-heads-theme');
      document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
